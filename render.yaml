services:
  - type: web
    name: engram-cloud
    runtime: docker
    dockerfilePath: ./docker/cloud/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      # Render injects PORT automatically; we mirror it into ENGRAM_PORT
      - key: ENGRAM_PORT
        value: 8080
      - key: ENGRAM_CLOUD_HOST
        value: 0.0.0.0
      - key: ENGRAM_DATABASE_URL
        fromDatabase:
          name: engram-db
          property: connectionString
      - key: ENGRAM_JWT_SECRET
        generateValue: true
      - key: ENGRAM_CLOUD_TOKEN
        sync: false  # set manually in Render dashboard
      - key: ENGRAM_CLOUD_ALLOWED_PROJECTS
        sync: false  # set manually: comma-separated project names

databases:
  - name: engram-db
    plan: starter
    databaseName: engram_cloud
    user: engram
